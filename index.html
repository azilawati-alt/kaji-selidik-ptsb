<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaji Selidik Kemudahan & Perkhidmatan PTSB</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mut:#5d6b7a;--line:#e1e5ea;--pri:#0b5fa5;--bar:#2a7fc1;--hi:#1f8a5b;--lo:#c2410c;--c1:#0b5fa5;--c2:#d9822b;--c3:#2f9e6e;--c4:#8a5cc2;--c5:#c2410c;--c6:#6b7a8c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#18202a;--ink:#e8edf2;--mut:#9aa8b6;--line:#2a3541;--pri:#5aa9e6;--bar:#4a9ad8;--hi:#4cc38a;--lo:#f08a55;--c1:#5aa9e6;--c2:#f0a860;--c3:#4cc38a;--c4:#b794e8;--c5:#f08a55;--c6:#9aa8b6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:28px 16px}
@media(prefers-color-scheme:dark){header{background:#12324f}}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}header .wrap{padding:0}
h1{margin:0 0 4px;font-size:clamp(20px,3.5vw,28px)}header p{margin:0;opacity:.9}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px;flex:1 1 150px}
select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:28px;display:block;margin:2px 0}.kpi span{font-size:13px;color:var(--mut)}
h2{font-size:17px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
section{margin-top:16px}
.row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 56px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.row .t{background:var(--line);border-radius:6px;height:16px;overflow:hidden}.row .t i{display:block;height:100%;background:var(--bar);border-radius:6px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:560px){.row{grid-template-columns:1fr 56px}.row .t{grid-column:1/-1;order:3}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin:8px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mut);font-size:11px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}th{color:var(--mut);font-weight:600;font-size:12px}
.lowc{color:var(--lo);font-weight:600}.empty{padding:30px;text-align:center;color:var(--mut)}
footer{margin:28px 0 40px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap"><h1>Kaji Selidik Kemudahan & Perkhidmatan PTSB</h1><p>Keputusan kepuasan staf dan pelajar mengikut jabatan dan tahun</p></div></header>
<main class="wrap">
<div class="filters">
 <label>Tahun<select id="fTahun"></select></label>
 <label>Jabatan<select id="fJab"></select></label>
 <label>Kategori responden<select id="fKat"></select></label>
</div>
<div class="kpis" id="kpis"></div>
<section class="card"><h2>Skor mengikut item</h2><p class="sub" id="barSub"></p><div id="bars"></div></section>
<section class="card"><h2>Trend mengikut tahun</h2><p class="sub">Pilih item untuk lihat perubahan dari tahun ke tahun bagi setiap jabatan.</p>
 <label style="display:block;max-width:360px;font-size:12px;color:var(--mut)">Item<select id="fItem" style="width:100%;margin-top:4px"></select></label>
 <div class="legend" id="legend"></div><div id="trend"></div></section>
<section class="card"><h2>Jadual perbandingan jabatan</h2><p class="sub" id="tblSub"></p><div class="tw" id="tbl"></div></section>
<footer id="foot"></footer>
</main>
<script>
/* ============ TETAPAN (hanya ini yang perlu diubah) ============ */

const $=id=>document.getElementById(id);
let DATA=[];
function parseCSV(t){const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=""}
 else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c="";if(r.some(x=>x.trim()!==""))out.push(r);r=[]}
 else c+=ch}
 if(c!==""||r.length){r.push(c);if(r.some(x=>x.trim()!==""))out.push(r)}return out}
function load(text){const rows=parseCSV(text);const h=rows[0].map(x=>x.trim().toLowerCase());
 const ix=n=>h.indexOf(n);const [a,b,c,d,e]=["tahun","jabatan","kategori","item","skor"].map(ix);
 DATA=rows.slice(1).map(r=>{let s=parseFloat(String(r[e]).replace('%','').replace(',','.'));if(isNaN(s))return null;
  if(s>1.0001)s=s/100;return{tahun:parseInt(r[a]),jab:r[b].trim(),kat:r[c].trim(),item:r[d].trim(),skor:s}}).filter(x=>x&&!isNaN(x.tahun))}
const uniq=k=>[...new Set(DATA.map(d=>d[k]))];
const JABORDER=["JKA","JKE","JKM","JP","JPA","JMSK"];
const sortJab=a=>a.sort((x,y)=>{const i=JABORDER.indexOf(x),j=JABORDER.indexOf(y);return(i<0?99:i)-(j<0?99:j)||x.localeCompare(y)});
const avg=a=>a.length?a.reduce((s,x)=>s+x.skor,0)/a.length:null;
const pct=v=>v==null?"-":(v*100).toFixed(1)+"%";
function fill(sel,opts,val){sel.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");if(val!=null)sel.value=val}
function init(){
 const years=uniq("tahun").sort((a,b)=>b-a);
 fill($("fTahun"),[["all","Semua tahun"],...years.map(y=>[y,y])],years[0]);
 fill($("fJab"),[["all","Semua jabatan"],...sortJab(uniq("jab")).map(j=>[j,j])]);
 fill($("fKat"),[["all","Staf & Pelajar"],...uniq("kat").sort().map(k=>[k,k])]);
 const items=[];DATA.forEach(d=>{if(!items.includes(d.item))items.push(d.item)});
 fill($("fItem"),items.map(i=>[i,i]),items.find(i=>/keseluruhan/i.test(i))||items[0]);
 ["fTahun","fJab","fKat","fItem"].forEach(id=>$(id).addEventListener("change",render));render()}
function filt(){const t=$("fTahun").value,j=$("fJab").value,k=$("fKat").value;
 return DATA.filter(d=>(t=="all"||d.tahun==t)&&(j=="all"||d.jab==j)&&(k=="all"||d.kat==k))}
function render(){
 const f=filt(),t=$("fTahun").value,j=$("fJab").value,k=$("fKat").value;
 const label=[t=="all"?"semua tahun":t,j=="all"?"semua jabatan":j,k=="all"?"staf & pelajar":k.toLowerCase()].join(" · ");
 // items
 const byItem={};f.forEach(d=>(byItem[d.item]??=[]).push(d));
 const items=Object.entries(byItem).map(([n,a])=>({n,v:avg(a)}));
 const main=items.find(x=>/keseluruhan/i.test(x.n));const rest=items.filter(x=>x!==main).sort((a,b)=>b.v-a.v);
 // KPIs
 if(!f.length){$("kpis").innerHTML='<div class="card empty" style="grid-column:1/-1">Tiada data untuk pilihan ini.</div>';$("bars").innerHTML="";$("tbl").innerHTML="";$("trend").innerHTML="";return}
 const best=rest[0],worst=rest[rest.length-1];
 $("kpis").innerHTML=
  `<div class="card kpi"><small>Kepuasan keseluruhan</small><b>${pct(main?main.v:avg(f))}</b><span>${label}</span></div>`+
  `<div class="card kpi"><small>Item tertinggi</small><b style="color:var(--hi)">${pct(best?.v)}</b><span>${best?.n??"-"}</span></div>`+
  `<div class="card kpi"><small>Item terendah</small><b style="color:var(--lo)">${pct(worst?.v)}</b><span>${worst?.n??"-"}</span></div>`+
  `<div class="card kpi"><small>Bilangan item dinilai</small><b>${items.length}</b><span>${new Set(f.map(d=>d.jab)).size} jabatan</span></div>`;
 // bars
 $("barSub").textContent=label+" (purata jika lebih daripada satu pilihan)";
 const ordered=main?[main,...rest]:rest;
 $("bars").innerHTML=ordered.map(x=>`<div class="row"><div>${x===main?"<b>"+x.n+"</b>":x.n}</div><div class="t"><i style="width:${(x.v*100).toFixed(1)}%;${x===main?"background:var(--pri)":""}"></i></div><div class="v">${pct(x.v)}</div></div>`).join("");
 // trend
 trend();
 // table
 const jabs=sortJab([...new Set(f.map(d=>d.jab))]);
 $("tblSub").textContent=label;
 const cell=(it,jb)=>avg(f.filter(d=>d.item==it&&d.jab==jb));
 $("tbl").innerHTML="<table><thead><tr><th>Item</th>"+jabs.map(x=>`<th>${x}</th>`).join("")+(jabs.length>1?"<th>Purata</th>":"")+"</tr></thead><tbody>"+
  ordered.map(x=>"<tr><td>"+x.n+"</td>"+jabs.map(jb=>{const v=cell(x.n,jb);return`<td class="${v!=null&&v<0.85?'lowc':''}">${pct(v)}</td>`}).join("")+(jabs.length>1?`<td><b>${pct(x.v)}</b></td>`:"")+"</tr>").join("")+"</tbody></table><p class='sub' style='margin-top:10px'>Skor di bawah 85% ditanda oren.</p>";
 const ys=uniq("tahun").sort();$("foot").textContent=`Data: tahun ${ys[0]}–${ys[ys.length-1]} · ${DATA.length} rekod · Dikemaskini ${new Date().toLocaleDateString("ms-MY")}`;
}
function trend(){
 const item=$("fItem").value,j=$("fJab").value,k=$("fKat").value;
 const d=DATA.filter(x=>x.item==item&&(j=="all"||x.jab==j)&&(k=="all"||x.kat==k));
 const years=[...new Set(d.map(x=>x.tahun))].sort(),jabs=sortJab([...new Set(d.map(x=>x.jab))]);
 const cols=["--c1","--c2","--c3","--c4","--c5","--c6"];
 $("legend").innerHTML=jabs.map((x,i)=>`<span><i style="background:var(${cols[i%6]})"></i>${x}</span>`).join("");
 if(!years.length){$("trend").innerHTML='<div class="empty">Tiada data.</div>';return}
 const all=d.map(x=>x.skor);let lo=Math.floor((Math.min(...all)-0.03)*20)/20;const hi=Math.min(1,Math.ceil((Math.max(...all)+0.01)*20)/20);if(hi-lo<0.15){lo=Math.max(0,hi-0.15)}
 const W=640,H=280,L=44,R=16,T=14,B=30;
 const X=y=>years.length==1?(L+W-R)/2:L+(W-L-R)*years.indexOf(y)/(years.length-1),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend ${item}">`;
 for(let v=lo;v<=hi+1e-9;v+=0.05){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`}
 years.forEach(y=>s+=`<text x="${X(y)}" y="${H-8}" text-anchor="middle">${y}</text>`);
 jabs.forEach((jb,i)=>{const c=`var(${cols[i%6]})`;const pts=years.map(y=>({y,v:avg(d.filter(x=>x.jab==jb&&x.tahun==y))})).filter(p=>p.v!=null);
  if(pts.length>1)s+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map(p=>X(p.y)+","+Y(p.v)).join(" ")}"/>`;
  pts.forEach(p=>s+=`<circle cx="${X(p.y)}" cy="${Y(p.v)}" r="4.5" fill="${c}"><title>${jb} ${p.y}: ${pct(p.v)}</title></circle>`);
  if(jabs.length<=3||true){const p=pts[pts.length-1];if(p)s+=`<text x="${X(p.y)}" y="${Y(p.v)-9}" text-anchor="middle" style="fill:${c};font-weight:600">${(p.v*100).toFixed(1)}</text>`}});
 $("trend").innerHTML=s+"</svg>";
}
async function start(){let txt=FALLBACK_CSV;
 if(CSV_URL){try{const r=await fetch(CSV_URL,{cache:"no-store"});if(!r.ok)throw 0;txt=await r.text()}catch(e){console.warn("Gagal baca CSV, guna data contoh");}}
 load(txt);init()}
start();
</script>

</html>
